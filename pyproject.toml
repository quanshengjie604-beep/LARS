[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcbrain"
version = "0.2.0"
description = "Evidence-first, asynchronous startup and funding data collection"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "tqdm>=4.65,<5",
]

[project.scripts]
vcbrain = "vcbrain.cli:main"

[tool.setuptools.packages.find]
include = ["vcbrain*"]

