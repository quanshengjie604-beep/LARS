[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-probability-engine"
version = "0.1.0"
description = "Probabilistic M1-M6 decision engine for startup screening"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "ngboost>=0.5",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scikit-survival>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
decision-engine = "decision_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

